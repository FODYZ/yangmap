# Golden set — ranking is defined by what it must achieve.
#
# Each entry: a question the way an engineer would ask it, and the pattern
# for the expected path. The metric is binary: does the expected path appear
# in the top FIVE results?
#
# Composition rule (criterion E6): every pattern here must match at least one
# path actually present in the index. A pattern with no match would test
# vendor coverage, not ranking — that's a different subject.
#
# Questions are deliberately kept in French, and vendor descriptions in
# English: that's the real-world situation this project targets, and it's
# what exercises the French->English lexicon in `yangmap/search.py`
# (`LEXIQUE`). Translating these questions to English would silently stop
# testing that translation layer, so don't.

- question: etat des transceivers SFP
  plateforme: nokia_sros
  attendu: '^/state/port\[[^\]]*\]/transceiver/'
  pourquoi: the port's transceiver subtree, not the coherent DWDM counters

- question: table de routage
  plateforme: nokia_sros
  attendu: '^/state/router\[[^\]]*\]/route-table/unicast/ipv4/'
  pourquoi: unicast IPv4 is the common case; neither multicast nor unreachable

- question: routes actives et inactives
  plateforme: nokia_sros
  # The question names no address family: unicast and multicast both
  # legitimately answer it. Requiring unicast would test an intent the
  # question doesn't carry.
  attendu: 'route-table/(unicast|multicast)/ipv[46]/statistics/.*/(active|available)-routes$'
  pourquoi: available-routes explicitly distinguishes active FIB from inactive RIB

- question: voisins BGP et etat des sessions
  plateforme: nokia_sros
  attendu: '^/state/router\[[^\]]*\]/bgp/neighbor\['
  pourquoi: the neighbor list of the routing context

- question: adjacences ISIS
  plateforme: nokia_sros
  # Verified against the 24.3.3 index: the `adjacency` node does exist under
  # `interface[]`. The netlive comment claiming otherwise dated from an
  # older introspection — the index settled it.
  attendu: '/isis\[[^\]]*\]/interface\[[^\]]*\]/adjacency'
  pourquoi: adjacencies are listed under the ISIS interface

- question: statistiques PPPoE des sessions abonnes
  plateforme: nokia_sros
  attendu: '/sap\[[^\]]*\]/pppoe/statistics/'
  pourquoi: PADI PADR PADT and the drops — the PPPoE diagnostic sequence

- question: temperature des optiques
  plateforme: nokia_sros
  attendu: '/transceiver/.*temperature'
  pourquoi: the transceiver's DDM

- question: sessions LDP
  plateforme: nokia_sros
  attendu: '/ldp/session\['
  pourquoi: the state of LDP sessions with peers

- question: utilisation processeur
  plateforme: nokia_sros
  attendu: '^/state/system/cpu\['
  pourquoi: system CPU sampling

- question: etat operationnel des interfaces
  plateforme: nokia_sros
  attendu: '^/state/router\[[^\]]*\]/interface\[|^/state/port\[[^\]]*\]/oper-state'
  pourquoi: routing interface or physical port state

- question: etat operationnel des interfaces
  plateforme: cisco_iosxe
  attendu: '^/interfaces/interface\['
  pourquoi: the interfaces-oper model

- question: transceivers SFP
  plateforme: cisco_iosxe
  attendu: '^/transceiver-oper-data/'
  pourquoi: Cisco publishes a dedicated operational model for the transceiver

- question: voisins BGP
  plateforme: cisco_iosxe
  attendu: '^/bgp-state-data/'
  pourquoi: BGP state lives in its own operational model

- question: utilisation processeur
  plateforme: cisco_iosxe
  attendu: '^/cpu-usage/'
  pourquoi: the model dedicated to CPU load

- question: voisins CDP
  plateforme: cisco_iosxe
  attendu: '^/cdp-neighbor-details'
  pourquoi: Cisco's neighbor discovery

- question: etat operationnel des interfaces
  plateforme: arista_eos
  attendu: '^/interfaces/interface\[[^\]]*\]/state/oper-status$'
  pourquoi: the openconfig leaf that carries the state

- question: transceivers SFP
  plateforme: arista_eos
  attendu: '/components/component\[[^\]]*\]/transceiver'
  pourquoi: openconfig places the transceiver under hardware components

- question: voisins BGP
  plateforme: arista_eos
  attendu: '/bgp/neighbors/neighbor\['
  pourquoi: under network-instance, protocol bgp

- question: voisins LLDP
  plateforme: arista_eos
  attendu: '^/lldp/interfaces/interface\[[^\]]*\]/neighbors'
  pourquoi: standardized neighbor discovery

- question: compteurs erreurs sur les interfaces
  plateforme: arista_eos
  attendu: '/state/counters/(in|out)-errors'
  pourquoi: interface error counters

# Added after confronting the real sros-lab-01: the ambiguous question
# "active and inactive routes" legitimately lets rib-api rank first, but as
# soon as the engineer names the routing table, that's the one they want.
- question: nombre de routes actives et inactives dans la table de routage
  plateforme: nokia_sros
  attendu: 'route-table/(unicast|multicast)/ipv[46]/statistics/.*/(active|available)-routes$'
  pourquoi: verified on real hardware — host shows 2 available for 0 active
